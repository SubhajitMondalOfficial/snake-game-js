<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game || CodeByte Subho</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <main>
        <section>
            
            <!-- Game information arrivrd here dynamically  -->
            <div class="infos">
                
                <div class="info">
                    <h3>Score : 
                        <span class="score">00</span>
                    </h3>
                </div>
                
                <div class="info">
                    <h3>High Score : 
                        <span class="high-score">00</span>
                    </h3>
                </div>

                <div class="info">
                    <h3>Time : 
                        <span class="time">00:00</span>
                    </h3>
                </div>
            </div>

            <!-- Board making -->
            <div class="board">
                
            </div>
        </section>

        <!-- Start Game Modal -->
        <div class="modal">
            <div class="startGame">
                <h3>Welcome to Snake Game</h3>
                <button class="btn btnStart">Start Game</button>
            </div>
        </div>

        <!-- Game Over Modal --> 
         <div class="gameOver">
            <h3 class="gmov">Game Over !!</h3>
            <div class="points">
                <h4 class="Yourscore">Your Score : </h4>
                <h4>||</h4>
                <h4 class="Yourtime">Your Time :</h4>
            </div>
            <button class="btn btnReStart">Start Again</button>
         </div>
    </main>


    <script src="script.js"></script>
</body>
</html>
